  <main>
    <div class="page-container">
      <!-- Sección Superior: Formulario -->
      <section class="contact-form">
        <h2 data-i18n="reg_tit">REGISTRO DE USUARIO</h2>
        
        <form id="registerForm">
            <fieldset>
                <legend data-i18n="reg_leyenda">Crear una cuenta nueva</legend>
                
                <div class="form-group">
                    <label for="reg_nombre" data-i18n="reg_nom">Nombre Completo:</label>
                    <input type="text" id="reg_nombre" name="reg_nombre" placeholder="Escribe tu nombre" data-i18n="reg_ph_nombre" required />
                </div>
                
                <div class="form-group">
                    <label for="reg_email" data-i18n="reg_correo">Correo Electrónico:</label>
                    <input type="email" id="reg_email" name="reg_email" placeholder="ejemplo@correo.com" data-i18n="reg_ph_correo" required />
                </div>
                
                <div class="form-group">
                    <label for="reg_pass" data-i18n="reg_pass">Contraseña:</label>
                    <input type="password" id="reg_pass" name="reg_pass" placeholder="Crea una contraseña" data-i18n="reg_ph_pass" required />
                </div>
                
                <div class="form-group">
                    <label class="group-title" data-i18n="reg_gen">Género:</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" id="reg_fem" name="reg_genero" value="femenino"/>
                            <span data-i18n="reg_fem">Femenino</span>
                        </label>
                        
                        <label class="radio-label">
                            <input type="radio" id="reg_masc" name="reg_genero" value="masculino"/>
                            <span data-i18n="reg_masc">Masculino</span>
                        </label>
                    </div>
                </div>
                
                <div class="form-actions">
                    <input type="submit" value="Registrarse" class="btn" data-i18n="reg_btn_1"/>
                    <input type="reset" value="Limpiar" class="btn" data-i18n="reg_btn_2"/>
                </div>

                <div id="mensaje" style="text-align: center; margin-top: 15px; font-weight: bold; font-size: 1.1rem;"></div>
            </fieldset>
        </form>
      </section>

      <!-- Sección Inferior: Redes Sociales -->

  <!-- CDN de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://ssosstgiclvshilkqksf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_cZvL38ywN6K6aIe2JV0Mqw_jWcFth4N';

    document.addEventListener('DOMContentLoaded', () => {
        let supabaseClient = null;
        if (typeof window.supabase !== 'undefined') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
            console.error('Error: La librería de Supabase no se cargó.');
            return;
        }

        const regForm = document.getElementById('registerForm');

        if (regForm) {
            regForm.addEventListener('submit', async (e) => {
                e.preventDefault(); 
                
                const name = document.getElementById('reg_nombre').value.trim();
                const email = document.getElementById('reg_email').value.trim();
                const password = document.getElementById('reg_pass').value.trim();
                
                // Obtener género seleccionado
                const generoRadio = document.querySelector('input[name="reg_genero"]:checked');
                const genero = generoRadio ? generoRadio.value : '';

                const mensajeDiv = document.getElementById('mensaje');
                mensajeDiv.style.color = '#ffd644';
                mensajeDiv.textContent = 'Procesando registro...';

                try {
                    // Inserción directa en la tabla de Supabase 'inicio sesiòn'
                    const { data, error } = await supabaseClient
                        .from('inicio sesiòn') 
                        .insert([
                            {
                                "nombre completo": name,
                                "correo electronico": email,
                                "contraseña": password,
                                "genero": genero
                            }
                        ]);

                    if (error) {
                        console.error('Error en Supabase:', error);
                        mensajeDiv.style.color = '#ff4c4c';
                        mensajeDiv.textContent = 'Error al registrar: ' + error.message;
                    } else {
                        mensajeDiv.style.color = '#4ade80';
                        mensajeDiv.textContent = '¡Registro exitoso! Redirigiendo...';
                        
                        // Guardar nombre localmente para la vista del perfil
                        localStorage.setItem('cs_username', name);
                        localStorage.setItem('userName', name);
                        
                        regForm.reset();
                        
                        setTimeout(() => {
                            window.location.href = 'usuario.html'; 
                        }, 1500);
                    }
                } catch (error) {
                    console.error('Error de red:', error);
                    mensajeDiv.style.color = '#ff4c4c';
                    mensajeDiv.textContent = 'Error de conexión con la base de datos.';
                }
            });
        }
    });
  </script>
  </script>
