<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CiberShield</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>

    <!-- Video de fondo -->
    <video autoplay muted loop id="bg-video">
        <source src="./img/fondo.jpg.mp4" type="video/mp4">
        Tu navegador no soporta videos HTML5.
    </video>

    <div class="login-container" style="position: relative;">
        <!-- Selector de idioma flotante ubicado en la esquina superior derecha del recuadro central -->
        <div style="position: absolute; top: 15px; right: 15px; z-index: 10;">
            <select id="selector-idioma" onchange="cambiarIdioma(this.value)" style="background-color: #0b192c; color: #ffffff; border: 1px solid #ffd700; border-radius: 5px; padding: 4px 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem;">
    <option value="es" style="background-color: #0b192c; color: #ffffff;">Español</option>
    <option value="qu" style="background-color: #0b192c; color: #ffffff;">Quechua</option>
    <option value="en" style="background-color: #0b192c; color: #ffffff;">English</option>
    <option value="zh" style="background-color: #0b192c; color: #ffffff;">Chino</option>
    <option value="ru" style="background-color: #0b192c; color: #ffffff;">Ruso</option>
    <option value="de" style="background-color: #0b192c; color: #ffffff;">Alemán</option>
    <option value="fr" style="background-color: #0b192c; color: #ffffff;">Francés</option>
    <option value="ca" style="background-color: #0b192c; color: #ffffff;">Catalán</option>
    <option value="ja" style="background-color: #0b192c; color: #ffffff;">Japonés</option>
    <option value="ko" style="background-color: #0b192c; color: #ffffff;">Coreano</option>
</select>
        </div>

        <div class="logo-area">
            <!-- Imagen con la clase para el tamaño y animación -->
            <img src="./img/logo-cibershelf.png" alt="Logo CiberShield" class="logo-image">
            
            <h1 data-i18n="logo_texto">CiberShield</h1>
            <p class="subtitle" data-i18n="log_sub">Inicia sesión en tu cuenta segura</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email" data-i18n="log_correo">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="" required>
            </div>

            <div class="form-group">
                <label for="password" data-i18n="log_pass">Contraseña</label>
                <input type="password" id="password" name="contrasena" placeholder="" required>
            </div>

            <button type="submit" class="btn-submit" data-i18n="log_btn">Ingresar</button>
        </form>

        <a href="formulario registro.html" class="back-home" data-i18n="log_registro">← Regístrarte</a>
    </div>
    

    <!-- Scripts -->
    <script src="./js/efectos.js"></script>
    <script src="./js/menu.js"></script>
    <!-- CDN de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://ssosstgiclvshilkqksf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_cZvL38ywN6K6aIe2JV0Mqw_jWcFth4N';

document.addEventListener('DOMContentLoaded', () => {
    let supabaseClient = null;
    if (typeof window.supabase !== 'undefined') {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } else {
        console.error('Error: La librería de Supabase no se cargó.');
        return;
    }

    const loginForm = document.getElementById('loginForm');

    if (loginForm) {
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault(); // Evita recargar la página o redirigir sin validar

            const emailVal = document.getElementById('email').value.trim();
            const passwordVal = document.getElementById('password').value.trim();

            if (!emailVal || !passwordVal) {
                alert('Por favor, ingresa tu correo y contraseña.');
                return;
            }

            try {
                // Consultar en la tabla 'inicio sesiòn' de Supabase
                const { data, error } = await supabaseClient
                    .from('inicio sesiòn')
                    .select('*')
                    .eq('correo electronico', emailVal)
                    .eq('contraseña', passwordVal);

                if (error) {
                    console.error('Error en Supabase:', error);
                    alert('Error al consultar la base de datos: ' + error.message);
                    return;
                }

                // Verificar si se encontró al usuario
                if (data && data.length > 0) {
                    // Extraer el nombre real registrado en la base de datos
                    const usuarioRegistrado = data[0]["nombre completo"] || emailVal;
                    
                    // Sobrescribir el localStorage con el usuario actual
                    localStorage.setItem('cs_username', usuarioRegistrado);
                    localStorage.setItem('userName', usuarioRegistrado);
                    
                    alert('¡Inicio de sesión exitoso!');
                    window.location.href = 'usuario.html';
                } else {
                    // Si las credenciales no existen, MUESTRA ALERTA Y NO REDIRIGE
                    alert('Correo o contraseña incorrectos. Verifica tus datos.');
                }

            } catch (err) {
                console.error('Error de conexión:', err);
                alert('Ocurrió un error al conectar con el servidor.');
            }
        });
    }
});
</script>
    </script>
    <script src="./js/chatboot.js"></script>
    <script src="./js/traductor.js"></script>
</body>
</html>
